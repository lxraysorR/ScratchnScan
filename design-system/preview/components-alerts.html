<!doctype html>
<html lang="en"><head><meta charset="utf-8" />
<title>Alerts</title>
<link rel="stylesheet" href="_card.css" />
<style></style>
</head><body><div class="card">
  <div class="eyebrow" style="margin-bottom:14px;">Alerts</div>
  <div style="display:flex; flex-direction:column; gap:10px;">
    <div style="display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:14px;font-size:13.5px;font-weight:600;background:rgba(31,107,84,.08);border:1px solid rgba(31,107,84,.16);color:#0b2f27;">
      <strong>Captured barcode:</strong>
      <span style="font-family:var(--font-mono); font-size:13px;">012345678905</span>
    </div>
    <div style="display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:14px;font-size:13.5px;font-weight:600;background:rgba(185,66,50,.08);border:1px solid rgba(185,66,50,.18);color:#8a2b20;">
      <span>We could not identify this product. Try a different photo or type the name.</span>
    </div>
    <div style="padding:8px 12px;border-radius:999px;font-size:12.5px;font-weight:700;color:#0b2f27;background:rgba(31,107,84,.07);border:1px solid rgba(31,107,84,.12);text-align:center;">10 free homemade creations included on this device.</div>
  </div>
</div></body></html>
