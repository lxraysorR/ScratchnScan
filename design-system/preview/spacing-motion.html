<!doctype html>
<html lang="en"><head><meta charset="utf-8" />
<title>Motion</title>
<link rel="stylesheet" href="_card.css" />
<style></style>
</head><body><div class="card">
  <div class="eyebrow" style="margin-bottom:14px;">Motion — Calm, never bouncy</div>
  <div style="display:flex; flex-direction:column; gap:10px;">
    
      <div style="display:flex; gap:14px; align-items:center; padding:10px 14px; background:var(--surface); border:1px solid var(--line); border-radius:14px;">
        <div style="font-size:13px; font-weight:800; color:var(--green); min-width:70px;">140ms</div>
        <div class="code" style="min-width:96px;">ease</div>
        <div style="font-size:12.5px; color:var(--ink-soft);">button press · scale(0.985)</div>
      </div>
      <div style="display:flex; gap:14px; align-items:center; padding:10px 14px; background:var(--surface); border:1px solid var(--line); border-radius:14px;">
        <div style="font-size:13px; font-weight:800; color:var(--green); min-width:70px;">160ms</div>
        <div class="code" style="min-width:96px;">ease</div>
        <div style="font-size:12.5px; color:var(--ink-soft);">color / background transitions</div>
      </div>
      <div style="display:flex; gap:14px; align-items:center; padding:10px 14px; background:var(--surface); border:1px solid var(--line); border-radius:14px;">
        <div style="font-size:13px; font-weight:800; color:var(--green); min-width:70px;">240ms</div>
        <div class="code" style="min-width:96px;">ease</div>
        <div style="font-size:12.5px; color:var(--ink-soft);">screen lift · translateY(8px) → 0</div>
      </div>
      <div style="display:flex; gap:14px; align-items:center; padding:10px 14px; background:var(--surface); border:1px solid var(--line); border-radius:14px;">
        <div style="font-size:13px; font-weight:800; color:var(--green); min-width:70px;">1400ms</div>
        <div class="code" style="min-width:96px;">infinite</div>
        <div style="font-size:12.5px; color:var(--ink-soft);">active stage pulse ring</div>
      </div>
      <div style="display:flex; gap:14px; align-items:center; padding:10px 14px; background:var(--surface); border:1px solid var(--line); border-radius:14px;">
        <div style="font-size:13px; font-weight:800; color:var(--green); min-width:70px;">2200ms</div>
        <div class="code" style="min-width:96px;">ease-in-out</div>
        <div style="font-size:12.5px; color:var(--ink-soft);">scanner line sweep</div>
      </div>
  </div>
</div></body></html>
