<!doctype html>
<html lang="en"><head><meta charset="utf-8" />
<title>Radii</title>
<link rel="stylesheet" href="_card.css" />
<style></style>
</head><body><div class="card">
  <div class="eyebrow" style="margin-bottom:14px;">Radii scale</div>
  <div class="row" style="align-items:flex-end;">
    
      <div style="flex:1; display:flex; flex-direction:column; align-items:center; gap:8px;">
        <div style="width:96px; height:72px; border-radius:12px; background:var(--surface); border:1px solid var(--line); box-shadow:var(--shadow-sm);"></div>
        <div style="font-size:12.5px; font-weight:800; color:var(--ink);">--radius-sm</div>
        <div class="code">12px · chips</div>
      </div>
      <div style="flex:1; display:flex; flex-direction:column; align-items:center; gap:8px;">
        <div style="width:96px; height:72px; border-radius:16px; background:var(--surface); border:1px solid var(--line); box-shadow:var(--shadow-sm);"></div>
        <div style="font-size:12.5px; font-weight:800; color:var(--ink);">--radius-md</div>
        <div class="code">16px · inputs</div>
      </div>
      <div style="flex:1; display:flex; flex-direction:column; align-items:center; gap:8px;">
        <div style="width:96px; height:72px; border-radius:22px; background:var(--surface); border:1px solid var(--line); box-shadow:var(--shadow-sm);"></div>
        <div style="font-size:12.5px; font-weight:800; color:var(--ink);">--radius-lg</div>
        <div class="code">22px · cards</div>
      </div>
      <div style="flex:1; display:flex; flex-direction:column; align-items:center; gap:8px;">
        <div style="width:96px; height:72px; border-radius:28px; background:var(--surface); border:1px solid var(--line); box-shadow:var(--shadow-sm);"></div>
        <div style="font-size:12.5px; font-weight:800; color:var(--ink);">--radius-xl</div>
        <div class="code">28px · hero / form</div>
      </div>
  </div>
</div></body></html>
