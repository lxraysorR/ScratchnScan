<!doctype html>
<html lang="en"><head><meta charset="utf-8" />
<title>Accents</title>
<link rel="stylesheet" href="_card.css" />
<style></style>
</head><body><div class="card">
  <div class="eyebrow" style="margin-bottom:14px;">Gold &amp; lime — Kitchen brass and fresh sprig</div>
  <div class="row">
    
  <div style="flex:1; min-width:0;">
    <div style="height:88px; border-radius:14px; background:#caa85d; box-shadow:var(--shadow-sm); position:relative; overflow:hidden;">
      <span style="position:absolute; bottom:8px; left:10px; color:#0b2f27; font-size:11px; font-weight:700; font-family:var(--font-mono);">#caa85d</span>
    </div>
    <div style="margin-top:8px; font-size:12.5px; font-weight:800; color:var(--ink);">Gold</div>
    <div class="code">--gold</div>
  </div>
    
  <div style="flex:1; min-width:0;">
    <div style="height:88px; border-radius:14px; background:#fff3bf; box-shadow:var(--shadow-sm); position:relative; overflow:hidden;">
      <span style="position:absolute; bottom:8px; left:10px; color:#0b2f27; font-size:11px; font-weight:700; font-family:var(--font-mono);">#fff3bf</span>
    </div>
    <div style="margin-top:8px; font-size:12.5px; font-weight:800; color:var(--ink);">Gold 2</div>
    <div class="code">--gold-2</div>
  </div>
    
  <div style="flex:1; min-width:0;">
    <div style="height:88px; border-radius:14px; background:#e6d79a; box-shadow:var(--shadow-sm); position:relative; overflow:hidden;">
      <span style="position:absolute; bottom:8px; left:10px; color:#0b2f27; font-size:11px; font-weight:700; font-family:var(--font-mono);">#e6d79a</span>
    </div>
    <div style="margin-top:8px; font-size:12.5px; font-weight:800; color:var(--ink);">Lime</div>
    <div class="code">--lime</div>
  </div>
  </div>
</div></body></html>
