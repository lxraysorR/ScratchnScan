<!doctype html>
<html lang="en"><head><meta charset="utf-8" />
<title>Shadows</title>
<link rel="stylesheet" href="_card.css" />
<style></style>
</head><body><div class="card">
  <div class="eyebrow" style="margin-bottom:14px;">Shadow system — Warm-tinted, never grey</div>
  <div class="row">
    
      <div style="flex:1; display:flex; flex-direction:column; align-items:center; gap:10px;">
        <div style="width:100%; height:80px; border-radius:18px; background:var(--surface); box-shadow:0 6px 16px rgba(16,30,22,.06);"></div>
        <div style="font-size:12.5px; font-weight:800; color:var(--ink);">--shadow-sm</div>
        <div class="code" style="text-align:center;">chips, list cards</div>
      </div>
      <div style="flex:1; display:flex; flex-direction:column; align-items:center; gap:10px;">
        <div style="width:100%; height:80px; border-radius:18px; background:var(--surface); box-shadow:0 12px 30px rgba(16,30,22,.08);"></div>
        <div style="font-size:12.5px; font-weight:800; color:var(--ink);">--shadow-md</div>
        <div class="code" style="text-align:center;">forms, results</div>
      </div>
      <div style="flex:1; display:flex; flex-direction:column; align-items:center; gap:10px;">
        <div style="width:100%; height:80px; border-radius:18px; background:var(--surface); box-shadow:0 22px 60px rgba(16,30,22,.14);"></div>
        <div style="font-size:12.5px; font-weight:800; color:var(--ink);">--shadow-lg</div>
        <div class="code" style="text-align:center;">hero, upgrade</div>
      </div>
  </div>
</div></body></html>
