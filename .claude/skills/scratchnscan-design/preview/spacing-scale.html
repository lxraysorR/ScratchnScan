<!doctype html>
<html lang="en"><head><meta charset="utf-8" />
<title>Spacing</title>
<link rel="stylesheet" href="_card.css" />
<style></style>
</head><body><div class="card">
  <div class="eyebrow" style="margin-bottom:14px;">Spacing scale — 4-pt grid</div>
  <div style="display:flex; flex-direction:column; gap:8px;">
    
      <div style="display:flex; align-items:center; gap:12px;">
        <div style="width:4px; height:18px; background:linear-gradient(145deg,var(--green-3),var(--green-2)); border-radius:4px; box-shadow:0 4px 8px rgba(11,47,39,.18);"></div>
        <div style="font-size:12px; font-weight:800; color:var(--ink); min-width:30px;">4px</div>
        <div class="code" style="min-width:96px;">--space-1</div>
        <div class="muted" style="font-size:11.5px;">tight chip gap</div>
      </div>
      <div style="display:flex; align-items:center; gap:12px;">
        <div style="width:8px; height:18px; background:linear-gradient(145deg,var(--green-3),var(--green-2)); border-radius:4px; box-shadow:0 4px 8px rgba(11,47,39,.18);"></div>
        <div style="font-size:12px; font-weight:800; color:var(--ink); min-width:30px;">8px</div>
        <div class="code" style="min-width:96px;">--space-2</div>
        <div class="muted" style="font-size:11.5px;">button gap</div>
      </div>
      <div style="display:flex; align-items:center; gap:12px;">
        <div style="width:12px; height:18px; background:linear-gradient(145deg,var(--green-3),var(--green-2)); border-radius:4px; box-shadow:0 4px 8px rgba(11,47,39,.18);"></div>
        <div style="font-size:12px; font-weight:800; color:var(--ink); min-width:30px;">12px</div>
        <div class="code" style="min-width:96px;">--space-3</div>
        <div class="muted" style="font-size:11.5px;">card inner row gap</div>
      </div>
      <div style="display:flex; align-items:center; gap:12px;">
        <div style="width:16px; height:18px; background:linear-gradient(145deg,var(--green-3),var(--green-2)); border-radius:4px; box-shadow:0 4px 8px rgba(11,47,39,.18);"></div>
        <div style="font-size:12px; font-weight:800; color:var(--ink); min-width:30px;">16px</div>
        <div class="code" style="min-width:96px;">--space-4</div>
        <div class="muted" style="font-size:11.5px;">card padding</div>
      </div>
      <div style="display:flex; align-items:center; gap:12px;">
        <div style="width:20px; height:18px; background:linear-gradient(145deg,var(--green-3),var(--green-2)); border-radius:4px; box-shadow:0 4px 8px rgba(11,47,39,.18);"></div>
        <div style="font-size:12px; font-weight:800; color:var(--ink); min-width:30px;">20px</div>
        <div class="code" style="min-width:96px;">--space-5</div>
        <div class="muted" style="font-size:11.5px;">card padding lg</div>
      </div>
      <div style="display:flex; align-items:center; gap:12px;">
        <div style="width:24px; height:18px; background:linear-gradient(145deg,var(--green-3),var(--green-2)); border-radius:4px; box-shadow:0 4px 8px rgba(11,47,39,.18);"></div>
        <div style="font-size:12px; font-weight:800; color:var(--ink); min-width:30px;">24px</div>
        <div class="code" style="min-width:96px;">--space-6</div>
        <div class="muted" style="font-size:11.5px;">section spacing</div>
      </div>
      <div style="display:flex; align-items:center; gap:12px;">
        <div style="width:32px; height:18px; background:linear-gradient(145deg,var(--green-3),var(--green-2)); border-radius:4px; box-shadow:0 4px 8px rgba(11,47,39,.18);"></div>
        <div style="font-size:12px; font-weight:800; color:var(--ink); min-width:30px;">32px</div>
        <div class="code" style="min-width:96px;">--space-7</div>
        <div class="muted" style="font-size:11.5px;">hero padding</div>
      </div>
  </div>
</div></body></html>
