<!doctype html>
<html lang="en"><head><meta charset="utf-8" />
<title>Buttons</title>
<link rel="stylesheet" href="_card.css" />
<style></style>
</head><body><div class="card">
  <div class="eyebrow" style="margin-bottom:14px;">Buttons</div>
  <div style="display:flex; flex-wrap:wrap; gap:10px; align-items:center;">
    <button style="border:0;border-radius:16px;padding:14px 18px;font-size:15px;font-weight:700;color:#fffdf8;background:linear-gradient(145deg,#1f6b54,#155442);box-shadow:0 14px 30px rgba(11,47,39,.28);min-height:48px;cursor:pointer;">Create Homemade Version</button>
    <button style="border:0;border-radius:16px;padding:14px 18px;font-size:15px;font-weight:700;color:#0b2f27;background:linear-gradient(145deg,#fff3bf,#caa85d);box-shadow:0 14px 30px rgba(202,168,93,.28);min-height:48px;cursor:pointer;">Upgrade coming soon</button>
    <button style="border:1px solid rgba(16,25,22,.10);border-radius:16px;padding:14px 18px;font-size:15px;font-weight:700;color:#0b2f27;background:rgba(24,63,43,.06);min-height:48px;cursor:pointer;">Type product name</button>
    <button style="border:0;border-radius:16px;padding:14px 18px;font-size:15px;font-weight:700;color:#fff;background:#b94232;min-height:48px;cursor:pointer;">Delete recipe</button>
    <button style="border:1px solid rgba(16,25,22,.10);border-radius:12px;padding:10px 14px;font-size:13px;font-weight:700;color:#0b2f27;background:#fffdf7;min-height:40px;cursor:pointer;">Clear barcode</button>
  </div>
  <div class="muted" style="margin-top:14px; font-size:12px;">Min height 48px (40px small). 16px radius. Filled buttons carry a colored shadow.</div>
</div></body></html>
