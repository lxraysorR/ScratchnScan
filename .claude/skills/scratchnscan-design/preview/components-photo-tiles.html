<!doctype html>
<html lang="en"><head><meta charset="utf-8" />
<title>Photo tiles</title>
<link rel="stylesheet" href="_card.css" />
<style></style>
</head><body><div class="card">
  <div class="eyebrow" style="margin-bottom:14px;">Photo tiles — Front &amp; back uploads</div>
  <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px;">
    
      <div style="border:1px dashed rgba(11,47,39,.18);background:linear-gradient(145deg,#fffdf7,#f8f1df);color:#0b2f27;border-radius:20px;padding:14px;display:grid;align-content:center;justify-items:center;gap:8px;text-align:center;min-height:132px;box-shadow:inset 0 1px 0 rgba(255,255,255,.9), 0 6px 16px rgba(16,30,22,.06);">
        <span style="width:42px;height:42px;border-radius:14px;display:grid;place-items:center;background:linear-gradient(145deg,#0b2f27,#071d18);color:#caa85d;box-shadow:0 10px 22px rgba(11,47,39,.22);"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2" /><circle cx="8.5" cy="10" r="1.6" /><path d="m4 17 5-5 4 4 3-3 4 4" /></svg></span>
        <strong style="font-size:14px;letter-spacing:-0.015em;">Add front photo</strong>
        <em style="font-style:normal;color:#66736d;font-size:11.5px;line-height:1.35;">Front photo helps identify the product</em>
      </div>
      <div style="border:1px dashed rgba(11,47,39,.18);background:linear-gradient(145deg,#fffdf7,#f8f1df);color:#0b2f27;border-radius:20px;padding:14px;display:grid;align-content:center;justify-items:center;gap:8px;text-align:center;min-height:132px;box-shadow:inset 0 1px 0 rgba(255,255,255,.9), 0 6px 16px rgba(16,30,22,.06);">
        <span style="width:42px;height:42px;border-radius:14px;display:grid;place-items:center;background:linear-gradient(145deg,#0b2f27,#071d18);color:#caa85d;box-shadow:0 10px 22px rgba(11,47,39,.22);"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2" /><circle cx="8.5" cy="10" r="1.6" /><path d="m4 17 5-5 4 4 3-3 4 4" /></svg></span>
        <strong style="font-size:14px;letter-spacing:-0.015em;">Add back photo</strong>
        <em style="font-style:normal;color:#66736d;font-size:11.5px;line-height:1.35;">Back photo helps read ingredients or barcode</em>
      </div>
  </div>
</div></body></html>
