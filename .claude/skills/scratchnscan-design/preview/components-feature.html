</head><body><div class="card">

        <div>

          <p style="margin:0;color:#66736d;font-size:13px;line-height:1.45;">Name, brand, category, and ingredient signals become the recipe context.</p>
        </div>
      </div>
      <div style="background:#fffdf7;border:1px solid rgba(16,25,22,.10);border-radius:22px;padding:16px;display:flex;gap:14px;align-items:flex-start;box-shadow:0 6px 16px rgba(16,30,22,.06);">
        <span style="width:44px;height:44px;border-radius:14px;background:linear-gradient(145deg,#f8f1df,#efe4c8);color:#0b2f27;display:grid;place-items:center;flex:0 0 auto;"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 14a8 8 0 1 1 16 0" /><path d="M2 14h20l-2 7H4z" /></svg></span>
        <div>
          <h3 style="margin:0 0 4px;font-size:15px;letter-spacing:-0.02em;color:#101916;font-weight:800;">Generate the homemade version</h3>
          <p style="margin:0;color:#66736d;font-size:13px;line-height:1.45;">Ingredients, steps, and smart swaps tuned to your preference.</p>
        </div>
      </div>
  </div>
