<!doctype html>
<html lang="en"><head><meta charset="utf-8" />
<title>Inputs</title>
<link rel="stylesheet" href="_card.css" />
<style></style>
</head><body><div class="card">
  <div class="eyebrow" style="margin-bottom:14px;">Input — Field</div>
  <div style="background:var(--surface); border:1px solid var(--line); border-radius:22px; padding:18px; box-shadow:var(--shadow-md);">
    <label style="display:block;font-size:13px;font-weight:800;color:#0b2f27;margin-bottom:8px;letter-spacing:-0.005em;">Product name</label>
    <input value="Oreos" style="width:100%;border:1px solid rgba(31,107,84,.55);background:#fff;color:#101916;border-radius:16px;padding:14px;font:inherit;font-size:15px;outline:none;box-shadow:0 0 0 4px rgba(31,107,84,.12);" />
    <div style="margin-top:14px;">
      <label style="display:block;font-size:13px;font-weight:800;color:#0b2f27;margin-bottom:8px;">Preference <span style="color:var(--muted); font-weight:600; font-size:12px;">(optional)</span></label>
      <input placeholder="less sugar, dairy-free, no seed oils" style="width:100%;border:1px solid rgba(24,63,43,.14);background:#fff;color:#101916;border-radius:16px;padding:14px;font:inherit;font-size:15px;outline:none;" />
    </div>
  </div>
</div></body></html>
